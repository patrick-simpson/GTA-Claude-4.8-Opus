name: Deploy to GitHub Pages

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # toktx (KTX-Software) makes the compressed KTX2 pictures (tools/assets/README.md). If it cannot be installed the
      # build still works: the pictures just stay webp (the models are compressed either way).
      - run: |
          curl -fsSL -o /tmp/ktx.deb https://github.com/KhronosGroup/KTX-Software/releases/download/v4.4.2/KTX-Software-4.4.2-Linux-x86_64.deb && sudo dpkg -i /tmp/ktx.deb && toktx --version || echo "KTX-Software not installed: pictures stay webp"

      # Type-checks, then bundles into dist/. If this fails nothing is deployed
      # and the site keeps serving the last good build.
      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      # The deploy step asks GitHub for the artifact a fraction of a second after the
      # upload finishes, and sometimes the listing has not caught up ("No artifacts
      # named github-pages were found"). Give it a moment.
      - run: sleep 25

      - uses: actions/deploy-pages@v5
        id: deployment
