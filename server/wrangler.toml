# PORT CALAMITY message service. Free plan: the Durable Object class must be SQLite backed
# (new_sqlite_classes), and it uses the WebSocket Hibernation API so idle time is not billed.
name = "port-calamity-city"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true

[[durable_objects.bindings]]
name = "CITY"
class_name = "City"

[[durable_objects.bindings]]
name = "SAVES"
class_name = "Saves"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["City"]

# v2 adds the cloud saves object (src/savesDo.ts). It is a new class, so the town and its facts are untouched.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["Saves"]

# No [vars] here, on purpose: TEST_BUDGET (replacement limits for the local tests) may only ever be
# given to `wrangler dev --var`. A deployed service must not have it.

# No logs are kept: the code never reads or prints an address, and request logging stays off.
[observability]
enabled = false
